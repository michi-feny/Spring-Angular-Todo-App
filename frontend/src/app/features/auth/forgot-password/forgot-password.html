<div class="row mt-5">
    <form class="col-3 border border-primary mx-auto rounded p-3"
        [formGroup]="forgotPasswordForm" (ngSubmit)="handleSubmit()"
    >
        <h1 class="text-primary h2 text-center">{{ 'FORGOT_PASSWORD.HEADING' | translate }}</h1>

        <app-flash-message/>

        <app-form-control
            [control]="forgotPasswordForm | control:'email'"
            label="{{ 'FORM.EMAIL' | translate }}"
            [type]="InputTypesEnum.Email"
        />

        <button class="btn btn-primary mx-auto" [disabled]="isLoading()">
            {{ 'FORGOT_PASSWORD.SUBMIT_BUTTON' | translate }}
        </button>
    </form>
</div>
