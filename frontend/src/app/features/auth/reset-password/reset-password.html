<div class="row mt-5">
    <form 
        class="col-3 border border-primary mx-auto rounded p-3"
        [formGroup]="resetPasswordForm" (ngSubmit)="handleSubmit()"
    >
        <h1 class="text-primary h2 text-center">{{ 'RESET_PASSWORD.HEADING' | translate }}</h1>

        <app-form-control
            [control]="resetPasswordForm | control:'password'"
            label="{{ 'FORM.PASSWORD' | translate }}"
            [type]="InputTypesEnum.Password"
        />

        <app-form-control
            [control]="resetPasswordForm | control:'confirmPassword'"
            label="{{ 'FORM.PASSWORD_CONFIRM' | translate }}"
            [type]="InputTypesEnum.Password"
        />

        <button class="btn btn-primary mx-auto d-flex align-items-center"
            [disabled]="loading"
        >
            {{ 'RESET_PASSWORD.SUBMIT_BUTTON' | translate }}
        </button>
    </form>
</div>
