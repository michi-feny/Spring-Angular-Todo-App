
<div *ngIf="errorMessage()" class="border border-danger rounded bg-danger-subtle p-4 mt-5 text-center">
    <span class="h5 text-danger-emphasis">{{ errorMessage() | translate }}</span>
</div>

<app-reset-password-form
    *ngIf="userId() && token()"
    [userId]="userId()"
    [token]="token()"
    [loading]="isLoading()"
    (submitNewPassword)="handleResetSubmit($event)">
</app-reset-password-form>
