
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-2">
    <input type="hidden" formControlName="id" />
  
    <div class="card mb-3 border-light bg-light">
      <div class="card-body">
        <div class="row g-3">
          
          <!-- Vorname -->
          <div class="col-md-6 col-12">
            <app-form-control
              [control]="getControl('firstName')"
              label="Vorname"
              placeholder="z.B. Max"
              [type]="inputTypes.Text">
            </app-form-control>
          </div>
  
          <!-- Nachname -->
          <div class="col-md-6 col-12">
            <app-form-control
              [control]="getControl('lastName')"
              label="Nachname"
              placeholder="z.B. Mustermann"
              [type]="inputTypes.Text">
            </app-form-control>
          </div>
  
          <!-- Sozialversicherungsnummer -->
          <div class="col-md-6 col-12">
            <app-form-control
              [control]="getControl('socialRecordNumber')"
              label="Sozialversicherungsnummer"
              placeholder="z.B. 1234567890"
              [type]="inputTypes.Number">
            </app-form-control>
          </div>
  
          <!-- Geburtsdatum -->
          <div class="col-md-6 col-12">
            <app-form-control
              [control]="getControl('birthDate')"
              label="Geburtsdatum"
              [type]="inputTypes.Date">
            </app-form-control>
          </div>
  
        </div>
      </div>
    </div>
  
    <div class="d-flex justify-content-end mt-3">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || form.pristine">
        Stammdaten ändern
      </button>
    </div>
  </form>
