<div [formGroup]="form" class="p-2">
  <div formArrayName="additionalSkills">
    @for (group of manager.array.controls; track group; let i = $index) {
      <div 
        [formGroupName]="i" 
        class="card mb-3 transition-all"
        [ngClass]="{
          'border-warning bg-light': manager.isUnsaved(i),
          'border-light bg-light': !manager.isUnsaved(i)
        }">
        <div class="card-body">
          
          <!-- Card Header & Status Badge -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-2">
              <h6 class="mb-0 fw-bold">Fähigkeit #{{ i + 1 }}</h6>
              @if (manager.isUnsaved(i)) {
                <span class="badge bg-warning text-dark">Ungespeichert</span>
              }
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2">
              <button 
                type="button" 
                class="btn btn-sm"
                [ngClass]="manager.isSaved(i) ? 'btn-outline-primary' : 'btn-success'"
                [disabled]="manager.isSaveDisabled(i)"
                (click)="saveSkill(i)">
                {{ manager.isSaved(i) ? 'Aktualisieren' : 'Speichern' }}
              </button>

              <span class="d-inline-block" [ngbTooltip]="manager.getDeleteTooltip(i)" container="body">
                <button 
                  type="button" 
                  class="btn btn-sm btn-outline-danger" 
                  [disabled]="!manager.canDelete(i)"
                  (click)="deleteSkill(i)">
                  ✕ Löschen
                </button>
              </span>
            </div>
          </div>

          <!-- Formular-Felder -->
          <div class="row g-2 align-items-end" formGroupName="personAdditionalHardSkillDto">
            <!-- Name der Fähigkeit -->
            <div class="col-md-7 col-12">
              <app-form-control
                [control]="$any(group.get('personAdditionalHardSkillDto.name'))"
                label="Fähigkeit"
                placeholder="z.B. Python, Führerschein B..."
                [type]="inputTypes.Text">
              </app-form-control>
            </div>

            <!-- Niveau / Level -->
            <div class="col-md-5 col-12">
              <app-form-control
                [control]="$any(group.get('personAdditionalHardSkillDto.level'))"
                label="Niveau / Level"
                placeholder="z.B. C1, Fortgeschritten..."
                [type]="inputTypes.Text">
              </app-form-control>
            </div>
          </div>

        </div>
      </div>
    } @empty {
      <div class="alert alert-secondary text-center my-2 py-3">
        Keine zusätzlichen Fähigkeiten eingetragen.
      </div>
    }
  </div>

  <!-- Hinzufügen-Button -->
  <div class="mt-3">
    <span class="d-inline-block" [ngbTooltip]="manager.hasUnsavedItem ? 'Bitte speichern Sie die neue Fähigkeit zuerst ab.' : ''" container="body">
      <button 
        type="button" 
        class="btn btn-outline-primary btn-sm" 
        [disabled]="manager.hasUnsavedItem"
        (click)="addSkill()">
        + Zusätzliche Fähigkeit hinzufügen
      </button>
    </span>
  </div>
</div>
