<div class="form-wrapper">
  <h3>Assign Person Country</h3>
  
  <div class="form-group">
    <label>Country:</label>
    <input 
      type="text" 
      [ngModel]="countrySearchQuery()" 
      (ngModelChange)="countrySearchQuery.set($event)" 
      placeholder="Search country..." 
      class="search-input-field" 
    />
    <select [ngModel]="selectedCountryId()" (ngModelChange)="selectedCountryId.set($event)">
      <option [ngValue]="undefined" disabled>Select a country</option>
      @for (country of filteredCountries(); track country.id) {
        <option [ngValue]="country.id">{{ country.name }}</option>
      }
    </select>
  </div>

  <div class="form-group checkbox-group">
    <label>
      <input type="checkbox" [(ngModel)]="formData().mainCountry" />
      Set as Main Country
    </label>
  </div>

  <button class="btn-primary" (click)="submit()">Save Country Assignment</button>

  @if (showOverwriteModal()) {
    <div class="modal-overlay">
      <div class="modal-content">
        <h4>Country Conflict</h4>
        <p class="error-text">{{ errorMessage() }}</p>
        <p>Would you like to overwrite the existing main country with this new data?</p>
        
        <div class="modal-actions">
          <button class="btn-secondary" (click)="showOverwriteModal.set(false)">No, Cancel</button>
          <button class="btn-danger" (click)="confirmOverwrite()">Yes, Overwrite</button>
        </div>
      </div>
    </div>
  }
</div>
