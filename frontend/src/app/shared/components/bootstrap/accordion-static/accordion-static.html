<div ngbAccordion [closeOthers]="true" (shown)="shown.emit($event)" (hidden)="hidden.emit($event)">
    @for (item of items; track item.id) {
        <div [ngbAccordionItem]="item.id.toString()">
            <h2 ngbAccordionHeader>
                <button ngbAccordionButton class="accordion-button" (click)="onItemClick(item.id)">
                    <ng-container 
                        *ngIf="headerTemplate" 
                        [ngTemplateOutlet]="headerTemplate"
                        [ngTemplateOutletContext]="{ $implicit: item }"
                    ></ng-container>
                    <ng-container *ngIf="!headerTemplate">{{ item.id }}</ng-container> 
                </button>
            </h2>
            <div ngbAccordionCollapse>
                <div class="accordion-body">
                    <ng-container 
                        *ngIf="bodyTemplate"
                        [ngTemplateOutlet]="bodyTemplate"
                        [ngTemplateOutletContext]="{ $implicit: item }"
                    ></ng-container>
                    <ng-container *ngIf="!bodyTemplate">Kein Body-Inhalt definiert.</ng-container> 
                </div>
            </div>
        </div>
    }
</div>
