spring.application.name=todo-app
spring.application.api-url=http://localhost:4200/api/v1/
spring.application.url=http://localhost:4200/

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3308/todo_test
spring.datasource.username=root
spring.datasource.password=your_strong_root_password

# Satisfy Hibernate direct metadata requirements
jakarta.persistence.jdbc.driver=org.mariadb.jdbc.Driver
jakarta.persistence.jdbc.url=jdbc:mariadb://localhost:3308/todo_test
jakarta.persistence.jdbc.user=root
jakarta.persistence.jdbc.password=your_strong_root_password

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.open-in-view=false

# Triggers your OnCreate group just before an SQL INSERT
spring.jpa.properties.jakarta.persistence.validation.group.pre-persist=ibee.webapp.todo_app.validation.idHandle.create.OnCreate

# Triggers your OnUpdate group just before an SQL UPDATE
spring.jpa.properties.jakarta.persistence.validation.group.pre-update=ibee.webapp.todo_app.validation.idHandle.update.OnUpdate


jwt.secret.key=4de22fc54d5239beb2fc60cf9081ba8838cddea3ec66dcc3e4a242035b1850a31f34dd61d8e26f8f6730eafa198f39651bf50ee89a556b39374be5507ed5036f
jwt.expiration.time=20000
jwt.refresh.expiration=86400000

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.auth=false

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false