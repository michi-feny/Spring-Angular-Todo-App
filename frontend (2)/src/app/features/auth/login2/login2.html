<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input 
        type="email" 
        class="form-control" 
        id="email" 
        formControlName="email"
        
        [class.is-invalid]="emailState.isInvalid" 
        [class.is-valid]="emailState.isValid"
      />
      
      <div *ngIf="emailState.message" class="invalid-feedback">
        {{ emailState.message }}
      </div>
      
      <div *ngIf="emailState.isValid" class="valid-feedback">
        Korrekte E-Mail-Adresse!
      </div>
    </div>
  
    <div class="mb-3">
      <label for="password" class="form-label">Passwort</label>
      <input 
        type="password" 
        class="form-control" 
        id="password" 
        formControlName="password"
        
        [class.is-invalid]="passwordState.isInvalid"
        [class.is-valid]="passwordState.isValid"
      />
      
      <div *ngIf="passwordState.message" class="invalid-feedback">
        {{ passwordState.message }}
      </div>
      
      <div *ngIf="passwordState.isValid" class="valid-feedback">
        Das Passwort ist gültig.
      </div>
    </div>
  
    <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
      Login
    </button>
  </form>
