<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-2">
    <div formArrayName="additionalSkills">
      @for (group of additionalSkillsArray.controls; track $index; let i = $index) {
        <div [formGroupName]="i" class="card mb-3 border-light bg-light">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <!-- Name der Fähigkeit -->
              <div class="col-md-5 col-12">
                <app-form-control
                  [control]="getControl(group, 'additionalHardSkill.name')"
                  [label]="'Fähigkeit #' + (i + 1)"
                  placeholder="z.B. Python, Führerschein B..."
                  [type]="inputTypes.Text">
                </app-form-control>
              </div>
  
              <!-- Niveau / Level -->
              <div class="col-md-3 col-6">
                <app-form-control
                  [control]="getControl(group, 'additionalHardSkill.level')"
                  label="Niveau / Level"
                  placeholder="z.B. C1, Fortgeschritten..."
                  [type]="inputTypes.Text">
                </app-form-control>
              </div>
  
              <!-- Kategorie -->
              <div class="col-md-3 col-4">
                <app-form-control
                  [control]="getControl(group, 'additionalHardSkill.category')"
                  label="Kategorie"
                  placeholder="z.B. IT, SPRACHE..."
                  [type]="inputTypes.Text">
                </app-form-control>
              </div>
  
              <!-- Entfernen Button -->
              <div class="col-md-1 col-2 text-end">
                <button 
                  type="button" 
                  class="btn btn-outline-danger btn-sm w-100" 
                  (click)="removeSkill(i)"
                  title="Eintrag entfernen">
                  ✕
                </button>
              </div>
            </div>
          </div>
        </div>
      } @empty {
        <div class="alert alert-secondary text-center my-2 py-3">
          Keine zusätzlichen Fähigkeiten eingetragen.
        </div>
      }
    </div>
  
    <div class="d-flex justify-content-between align-items-center mt-3">
      <button type="button" class="btn btn-outline-primary btn-sm" (click)="addSkill()">
        + Zusätzliche Fähigkeit hinzufügen
      </button>
  
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        Zusätzliche Fähigkeiten speichern
      </button>
    </div>
  </form>
