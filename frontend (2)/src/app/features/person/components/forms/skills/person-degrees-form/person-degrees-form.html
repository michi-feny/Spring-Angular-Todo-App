<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-2">
  <div formArrayName="degreesArray">
    @for (group of degreesArray.controls; track $index) {
      <div [formGroupName]="$index" class="card mb-3 p-3 border-light bg-light">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">Abschluss #{{ $index + 1 }}</h6>
          <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeDegree($index)">
            Entfernen
          </button>
        </div>

        <!-- Abschluss Bezeichnung & Level -->
        <div class="row g-2">
          <div class="col-md-8">
            <app-form-control
              [control]="getControl(group, 'degree.name')"
              label="Bezeichnung"
              placeholder="z.B. Bachelor of Science"
              [type]="inputTypes.Text">
            </app-form-control>
          </div>
          <div class="col-md-4">
            <app-form-control
              [control]="getControl(group, 'degree.level')"
              label="Kürzel / Level"
              placeholder="z.B. BSc / Level 6"
              [type]="inputTypes.Text">
            </app-form-control>
          </div>
        </div>

        <!-- Bildungseinrichtung -->
        <div class="row g-2 mt-1">
          <div class="col-md-12">
            <app-form-control
              [control]="getControl(group, 'institution.name')"
              label="Bildungseinrichtung"
              placeholder="z.B. Universität Wien"
              [type]="inputTypes.Text">
            </app-form-control>
          </div>
        </div>

        <!-- Zeiträume & Fortschritt -->
        <div class="row g-2 mt-1">
          <div class="col-md-4">
            <app-form-control
              [control]="getControl(group, 'startDate')"
              label="Startdatum"
              [type]="inputTypes.Date">
            </app-form-control>
          </div>
          <div class="col-md-4">
            <app-form-control
              [control]="getControl(group, 'endDate')"
              label="Enddatum"
              [type]="inputTypes.Date">
            </app-form-control>
          </div>
          <div class="col-md-4">
            <app-form-control
              [control]="getControl(group, 'progressInPercent')"
              label="Fortschritt (%)"
              placeholder="0 - 100"
              [type]="inputTypes.Number">
            </app-form-control>
          </div>
        </div>

      </div>
    } @empty {
      <div class="alert alert-secondary text-center my-2 py-3">
        Keine Abschlüsse eingetragen.
      </div>
    }
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <button type="button" class="btn btn-outline-primary btn-sm" (click)="addDegree()">
      + Weitere Qualifikation hinzufügen
    </button>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      Abschlüsse speichern
    </button>
  </div>
</form>
