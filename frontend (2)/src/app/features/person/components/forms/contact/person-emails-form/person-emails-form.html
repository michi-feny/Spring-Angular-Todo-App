<div [formGroup]="form" class="p-2">
  <div formArrayName="emails">
    @for (group of emailsArray.controls; track $index; let i = $index) {
      <div [formGroupName]="i" class="card mb-3 border-light bg-light">
        <div class="card-body">
          <div class="row g-3 align-items-center">
            
            <!-- Radio für Haupt-E-Mail -->
            <div class="col-md-2 col-12 pb-2">
              <div class="form-check">
                <input 
                  type="radio" 
                  name="mainEmailRadio" 
                  class="form-check-input" 
                  [id]="'mainEmail_' + i"
                  [checked]="group.get('mainEmail')?.value"
                  (change)="setMainEmail(i)" />
                <label class="form-check-label fw-bold small" [for]="'mainEmail_' + i">
                  Hauptadresse
                </label>
              </div>
            </div>

            <!-- E-Mail-Adresse -->
            <div class="col-md-7 col-sm-8">
              <app-form-control
                [control]="getControl(group, 'emailAddress.emailAddress')"
                label="E-Mail-Adresse"
                placeholder="z.B. max.mustermann@example.com"
                [type]="inputTypes.Email">
              </app-form-control>
            </div>

            <!-- Buttons pro Karte: Speichern/Aktualisieren & Löschen -->
            <div class="col-md-3 col-12 text-end">
              <button 
                type="button" 
                class="btn btn-sm me-2"
                [ngClass]="group.get('emailAddress.id')?.value ? 'btn-outline-primary' : 'btn-success'"
                [disabled]="group.invalid"
                (click)="saveSingleEmail(i)">
                {{ group.get('emailAddress.id')?.value ? 'Aktualisieren' : 'Speichern' }}
              </button>

              <button 
                type="button" 
                class="btn btn-sm btn-outline-danger" 
                (click)="deleteEmail(i)"
                title="E-Mail entfernen">
                Löschen
              </button>
            </div>

          </div>
        </div>
      </div>
    } @empty {
      <div class="alert alert-secondary text-center my-2 py-3">
        Keine E-Mail-Adressen eingetragen.
      </div>
    }
  </div>

  <div class="mt-3">
    <button type="button" class="btn btn-outline-primary btn-sm" (click)="addEmail()">
      + E-Mail-Adresse hinzufügen
    </button>
  </div>
</div>
