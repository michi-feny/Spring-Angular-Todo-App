<div [formGroup]="form" class="p-2">
  <div formArrayName="addresses">
    @for (group of addressesArray.controls; track $index; let i = $index) {
      <div [formGroupName]="i" class="card mb-3 border-light bg-light">
        <div class="card-body">
          
          <!-- Top Row: Radio für Hauptadresse & Aktionen-Buttons -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input 
                type="radio" 
                name="mainAddressRadio" 
                class="form-check-input" 
                [id]="'mainAddress_' + i"
                [checked]="group.get('mainAddress')?.value"
                (change)="setMainAddress(i)" />
              <label class="form-check-label fw-bold small" [for]="'mainAddress_' + i">
                Hauptadresse
              </label>
            </div>

            <div>
              <button 
                type="button" 
                class="btn btn-sm me-2"
                [ngClass]="group.get('address.id')?.value ? 'btn-outline-primary' : 'btn-success'"
                [disabled]="group.invalid"
                (click)="saveSingleAddress(i)">
                {{ group.get('address.id')?.value ? 'Aktualisieren' : 'Speichern' }}
              </button>

              <button 
                type="button" 
                class="btn btn-outline-danger btn-sm" 
                (click)="deleteAddress(i)"
                title="Adresse entfernen">
                ✕ Löschen
              </button>
            </div>
          </div>

          <!-- Address Fields -->
          <div class="row g-3">
            <!-- Straße -->
            <div class="col-md-8 col-sm-12">
              <app-form-control
                [control]="getControl(group, 'address.street')"
                label="Straße"
                placeholder="z.B. Hauptstraße"
                [type]="inputTypes.Text">
              </app-form-control>
            </div>

            <!-- Hausnummer -->
            <div class="col-md-4 col-sm-12">
              <app-form-control
                [control]="getControl(group, 'address.houseNumber')"
                label="Hausnummer / Tür"
                placeholder="z.B. 12a / Top 3"
                [type]="inputTypes.Text">
              </app-form-control>
            </div>

            <!-- PLZ -->
            <div class="col-md-3 col-sm-4">
              <app-form-control
                [control]="getControl(group, 'address.zipCode')"
                label="PLZ"
                placeholder="z.B. 1010"
                [type]="inputTypes.Text">
              </app-form-control>
            </div>

            <!-- Ort -->
            <div class="col-md-5 col-sm-8">
              <app-form-control
                [control]="getControl(group, 'address.city')"
                label="Ort / Stadt"
                placeholder="z.B. Wien"
                [type]="inputTypes.Text">
              </app-form-control>
            </div>

            <!-- Nationality ID (Land) -->
            <div class="col-md-4 col-sm-12">
              <app-form-control
                [control]="getControl(group, 'address.nationalityId')"
                label="Länder-ID (Nationality ID)"
                placeholder="1"
                [type]="inputTypes.Number">
              </app-form-control>
            </div>
          </div>

        </div>
      </div>
    } @empty {
      <div class="alert alert-secondary text-center my-2 py-3">
        Keine Adressen eingetragen.
      </div>
    }
  </div>

  <div class="mt-3">
    <button type="button" class="btn btn-outline-primary btn-sm" (click)="addAddress()">
      + Adresse hinzufügen
    </button>
  </div>
</div>
