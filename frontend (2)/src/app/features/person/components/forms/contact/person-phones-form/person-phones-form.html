<div [formGroup]="form" class="p-2">
  <div formArrayName="phones">
    @for (group of phonesArray.controls; track $index; let i = $index) {
      <div [formGroupName]="i" class="card mb-3 border-light bg-light">
        <div class="card-body">
          <div class="row g-3 align-items-center">
            
            <!-- Radio für Hauptnummer -->
            <div class="col-md-3 col-12 pb-2">
              <div class="form-check">
                <input 
                  type="radio" 
                  name="mainNumberRadio" 
                  class="form-check-input" 
                  [id]="'mainNumber_' + i"
                  [checked]="group.get('mainPhoneNumber')?.value"
                  (change)="setMainNumber(i)" />
                <label class="form-check-label fw-bold small" [for]="'mainNumber_' + i">
                  Hauptnummer
                </label>
              </div>
            </div>

            <!-- Ländervorwahl -->
            <div class="col-md-2 col-sm-4">
              <app-form-control
                [control]="getControl(group, 'phoneNumber.countryCode')"
                label="Vorwahl"
                placeholder="+43"
                [type]="inputTypes.Text">
              </app-form-control>
            </div>

            <!-- Telefonnummer -->
            <div class="col-md-4 col-sm-8">
              <app-form-control
                [control]="getControl(group, 'phoneNumber.phoneNumber')"
                label="Telefonnummer (ohne 0)"
                placeholder="6641234567"
                [type]="inputTypes.Text">
              </app-form-control>
            </div>

            <!-- Button pro Karte: Neu anlegen ODER Aktualisieren -->
            <div class="col-md-3 col-12 text-end">
              <button 
                type="button" 
                class="btn btn-sm"
                [ngClass]="group.get('phoneNumber.id')?.value ? 'btn-outline-primary' : 'btn-success'"
                [disabled]="group.invalid"
                (click)="saveSinglePhone(i)">
                {{ group.get('phoneNumber.id')?.value ? 'Aktualisieren' : 'Speichern' }}
              </button>

              <button 
                type="button" 
                class="btn btn-sm btn-outline-danger"
                (click)="deletePhone(i)">
                Löschen
              </button>
            </div>

          </div>
        </div>
      </div>
    } @empty {
      <div class="alert alert-secondary text-center my-2 py-3">
        Keine Telefonnummern eingetragen.
      </div>
    }
  </div>

  <div class="mt-3">
    <button type="button" class="btn btn-outline-primary btn-sm" (click)="addPhone()">
      + Telefonnummer hinzufügen
    </button>
  </div>
</div>
