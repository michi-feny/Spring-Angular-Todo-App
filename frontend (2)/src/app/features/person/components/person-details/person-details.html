@if (person) {
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <ngbd-accordion-static 
          [items]="accordionSections" 
          [headerTemplate]="accordionHeaderTpl" 
          [bodyTemplate]="accordionBodyTpl">
        </ngbd-accordion-static>
      </div>
    </div>
  }
    <!-- HEADER TEMPLATE -->
    <ng-template #accordionHeaderTpl let-section>
        <strong>{{ section.title }}</strong>
    </ng-template>
  
<!-- BODY TEMPLATE -->
<ng-template #accordionBodyTpl let-section>

    @if (section.id === 'generalData') {
      <app-person-general-form
        [person]="person.person" 
        (save)="onSaveGeneralData($event)">
      </app-person-general-form>
    }

    @if (section.id === 'nationalitys') {
      <app-person-nationalities-form 
        [nationalities]="person.nationalities || []" 
        [personId]="person.person.id"
        (save)="onSaveNationality($event)">
      </app-person-nationalities-form>
    }

    @if (section.id === 'addresses') {
      <app-person-addresses-form
        [addresses]="person.addresses || []"
        [personId]="person.person.id"
        (save)="onSaveAddress($event)"
        (delete)="onDeleteAddress($event)"
        >
      </app-person-addresses-form>
    }  

    @if (section.id === 'phones') {
      <app-person-phones-form
        [phones]="person.phones"
        [personId]="person.person.id"
        (save)="onSavePhone($event)"
        (delete)="onDeletePhone($event)"
        >
      </app-person-phones-form>
    } 

    @if (section.id === 'emails') {
      <app-person-emails-form
        [personId]="person.person.id"
        [emails]="person.emails || []"
        (save)="onSaveEmail($event)"
        >
      </app-person-emails-form>
    }  
  <!--
    @if (section.id === 'degrees') {
      <app-person-degrees-form 
        [degrees]="person?.degrees || []" 
        (save)="onSaveDegrees($event)">
      </app-person-degrees-form>
    }
  
    @if (section.id === 'professions') {
      <app-person-professions-form
        [professions]="person?.professions || []" 
        (save)="onSaveProfessions($event)">
      </app-person-professions-form>
    }
  
    @if (section.id === 'softSkills') {
      <app-person-soft-skills-form 
        [softSkills]="person?.softSkills || []"
        (save)="onSaveSoftSkills($event)">
      </app-person-soft-skills-form>
    }
  
    @if (section.id === 'additionalSkills') {
      <app-person-additional-skills-form
        [additionalSkills]="person?.additionalSkills || []"
        (save)="onSaveAdditionalSkills($event)">
      </app-person-additional-skills-form>
    }
  -->
  </ng-template>
